# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/interview
spring.datasource.username=interview_db_user
spring.datasource.password=d9c7c65f-dfe0-41ec-be4b-a6e7460763fb
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway



spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=900
jwt.refresh-token-expiry=604800

# Google OAuth2
google.client-id=${GOOGLE_CLIENT_ID:xxx}

# Quiz
quiz.preview-limit=3
quiz.guest-session-ttl=3600

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://mulakatim.com,http://localhost:5173}

# Logging
logging.level.com.mulakatim=INFO
logging.level.org.springframework.security=WARN
