name: Deploy to Server

on:
  push:
    branches:
      - main  # change to your branch name if different

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-deploy]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'  # change to your Java version
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy jar to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "target/*.jar"
          target: "/root/type-universe/"
          strip_components: 1  # removes the "target/" prefix on the server

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /root/type-universe

            # Build new image
            docker build -t type-universe-be .

            # Stop and remove old container if exists
            docker stop type-universe-be || true
            docker rm type-universe-be || true

            # Run new container
            docker run -d \
              --name type-universe-be \
              --network mynet \
              -p 8080:8080 \
              type-universe-be

            # Clean up old unused images
            docker image prune -f